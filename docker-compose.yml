services:
  postgres:
    image: postgres:15-alpine
    container_name: jungle_gaming_challenge_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jungle_gaming_challenge_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3.8.0
    container_name: jungle_gaming_challenge_localstack
    ports:
      - '4566:4566'
    environment:
      - SERVICES=sqs
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - ACTIVATE_PRO=0
    volumes:
      - localstack_data:/var/lib/localstack

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: jungle_gaming_challenge_keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: [ "start-dev" ]
    ports:
      - "8080:8080"
    restart: always

volumes:
  pgdata:
  localstack_data: